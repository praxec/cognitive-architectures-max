# orchestrators/flow.debug.systematic.yaml
#
# THE optimal debugging workflow — structured to beat LLM-alone debugging.
# Extends the base repo's flow.bugfix-from-error-log with the load-bearing
# disciplines it skips: an explicit GROUNDED ROOT-CAUSE-ANALYSIS gate (the
# scientific-method falsification cycle + evidence-grounded Five Whys) that
# BLOCKS the fix until the root cause is VERIFIED. An LLM alone guesses a fix
# from the error text; this flow forces reproduce -> observe -> falsifiable
# hypothesis -> disprove-while-exploring -> verified root cause -> fix -> the
# fix actually fixes the repro + a regression test.
#
# Composes base CA diagnose/implement/verify/review caps + the cognitive-max
# cap.diagnose.root-cause (which surfaces diagnose.debug.systematic). Same
# state-shape + cross-repo caveats as flow.add-ui-feature.
workflows:
  flow.debug.systematic:
    description: |
      Systematic, root-cause-gated bugfix: parse -> reproduce -> localize ->
      GROUNDED root-cause analysis (verified gate) -> scope-bounded fix ->
      regression verify -> adversarial review -> PR. No fix is attempted until
      the root cause is evidence-grounded and survived falsification.
    inputs:
      error_log: { type: string, required: true }
      base_ref:  { type: string, default: main }
    initialState: parsing
    states:
      parsing:
        transitions:
          parse:
            target: reproducing
            actor: deterministic
            executor:
              kind: workflow
              definitionId: cognitive/cap.diagnose.parse-error
              use:
                inputs:
                  error_log: "$.context.error_log"
                outputs:
                  "$.context.parsed": parsed

      reproducing:
        transitions:
          repro:
            target: localizing
            actor: deterministic
            executor:
              kind: workflow
              definitionId: cognitive/cap.diagnose.reproduce
              use:
                inputs:
                  parsed: "$.context.parsed"
                outputs:
                  "$.context.repro_steps": repro_steps

      localizing:
        transitions:
          localize:
            target: root_cause_analysis
            actor: deterministic
            executor:
              kind: workflow
              definitionId: cognitive/cap.diagnose.localize
              use:
                inputs:
                  parsed:      "$.context.parsed"
                  repro_steps: "$.context.repro_steps"
                outputs:
                  "$.context.defect_location": defect_location

      root_cause_analysis:
        # The load-bearing addition: grounded, falsification-driven RCA. The
        # cap surfaces diagnose.debug.systematic and emits verified=true only
        # when the cause is evidence-grounded and survived every disproof.
        transitions:
          analyze:
            target: rca_gate
            actor: deterministic
            executor:
              kind: workflow
              definitionId: cognitive-max/cap.diagnose.root-cause
              use:
                inputs:
                  parsed:          "$.context.parsed"
                  repro_steps:     "$.context.repro_steps"
                  defect_location: "$.context.defect_location"
                outputs:
                  "$.context.root_cause":   root_cause
                  "$.context.rca_verified": verified
                  "$.context.audit_trail":  audit_trail

      rca_gate:
        # Enforce "no fix until the root cause is verified" — the discipline
        # that separates this from guess-and-patch.
        transitions:
          advance:
            target: planning
            actor: deterministic
            guards:
              - kind: expr
                expr: "$.context.rca_verified == true"
          abort:
            target: failed
            actor: deterministic
            guards:
              - kind: expr
                expr: "$.context.rca_verified == false"

      planning:
        transitions:
          plan:
            target: changing
            actor: deterministic
            executor:
              kind: workflow
              definitionId: cognitive/cap.plan.fix
              use:
                inputs:
                  defect_location: "$.context.defect_location"
                  repro_steps:     "$.context.repro_steps"
                outputs:
                  "$.context.fix_plan": plan

      # Replaces the old implementing -> verifying -> verified trio with the
      # reusable change atom (flow.change): build_mode 'scope-bounded' routes
      # to the SAME cap.implement.scope-bounded builder `implementing` called
      # directly before; verify_mode 'regression' routes to the SAME
      # cap.verify.regression-tests verifier `verifying` called directly
      # before, with its {ok}->{status} shape mapped onto ws_verify inside the
      # atom. `deliverable` is fix_plan — exactly what `implementing` passed
      # as both `plan` and `scope_paths` to cap.implement.scope-bounded (the
      # atom's building_scope arm threads the SAME deliverable to both).
      # `backstop_cwd` is $.run.repo_root — the ambient repo root
      # cap.implement.scope-bounded already ran in (no repoRoot override
      # existed before this migration). defect_location/repro_steps thread
      # the SAME diagnosis evidence `verifying` passed directly, so the
      # regression verifier gets identical context.
      changing:
        goal: Build the scope-bounded fix and regression-verify it via the reusable change atom.
        transitions:
          change:
            target: change_gate
            actor: deterministic
            executor:
              kind: workflow
              definitionId: cognitive/flow.change
              use:
                inputs:
                  deliverable:     "$.context.fix_plan"
                  backstop_cwd:    "$.run.repo_root"
                  build_mode:      "scope-bounded"
                  verify_mode:     "regression"
                  defect_location: "$.context.defect_location"
                  repro_steps:     "$.context.repro_steps"
                outputs:
                  "$.context.impl_files_changed": impl_files_changed
                  "$.context.ws_verify":          ws_verify

      # DoD HANDOFF GATE: replaces the old `verified` gate. flow.change's own
      # outcomes already enforce the honest DoD (impl_files_changed >= 1 AND
      # ws_verify.status == 'pass') internally and route any miss to its own
      # `failed` terminal — which errors THIS `changing` transition and fails
      # the mission before change_gate is ever reached. This gate re-checks
      # the same two conditions as fail-fast defense-in-depth (same pattern as
      # flow.implement.deliverable's change_gate). Exhaustive: guarded
      # advance (both hold) | unguarded abort (default).
      change_gate:
        transitions:
          advance:
            target: reviewing
            actor: deterministic
            guards:
              - kind: expr
                expr: "$.context.impl_files_changed >= 1"
              - kind: expr
                expr: "$.context.ws_verify.status == 'pass'"
          abort:
            target: failed
            actor: deterministic

      reviewing:
        transitions:
          review:
            target: reviewed
            actor: deterministic
            executor:
              kind: workflow
              definitionId: cognitive/cap.review.adversarial
              use:
                inputs:
                  diff_against: "$.context.base_ref"
                outputs:
                  "$.context.review_verdict":  verdict
                  "$.context.review_findings": findings

      reviewed:
        transitions:
          advance:
            target: opening_pr
            actor: deterministic
            guards:
              - kind: expr
                expr: "$.context.review_verdict == 'approved'"
          abort:
            target: failed
            actor: deterministic
            guards:
              - kind: expr
                expr: "$.context.review_verdict == 'rejected'"
          # V23 poka-yoke: routes an out-of-domain verdict (e.g. the review
          # enum's 'needs-revision') deliberately to failed, not a fall-through.
          default:
            target: failed
            actor: deterministic

      opening_pr:
        transitions:
          open:
            target: done
            actor: deterministic
            executor:
              kind: workflow
              definitionId: cognitive/cap.coordinate.pr-open
              use:
                inputs:
                  title: "$.context.error_log"
                  body:  "$.context.error_log"
                  base:  "$.context.base_ref"
                outputs:
                  "$.context.pr_url":    url
                  "$.context.pr_number": pr_number

      done:
        terminal: true

      failed:
        terminal: true
