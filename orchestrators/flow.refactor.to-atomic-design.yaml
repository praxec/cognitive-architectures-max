# orchestrators/flow.refactor.to-atomic-design.yaml
#
# Refactor an existing (often god-) component into an Atomic Design tree, safely.
# Leverages structureos (god-file/complexity detection) in the planning state,
# the `implement.atomic.component-design` skill (the decomposition craft), the UI-green
# gate, and the React-antipattern review. The UX-factory analogue of the base
# repo's `cognitive/flow.safe-refactor`.
#
# Same state-shape + cross-repo-reference caveats as flow.add-ui-feature
# (load-test pending; base caps referenced as cognitive/cap.*, local as
# cognitive-max/cap.*). See docs/spec-p1-ui-verify-pack.md.
#
# MIGRATED (feat/migrate-max-ui-changeatom) to compose the reusable change atom
# (base pack `cognitive/flow.change`, build_mode: "tdd") instead of inlining its
# own build (cap.implement.tdd-loop) + `hop_slot: verify` + gate. The former
# `refactoring` -> `verifying_ui` -> `ui_verified` trio is now ONE `changing` hop
# to flow.change + a `change_gate` reading the atom's DoD-evidence outputs
# (impl_files_changed / ws_verify). See flow.change's own header
# (../../cognitive-architectures/orchestrators/flow.change.yaml) + the canonical
# wrap pattern in that repo's flow.implement.deliverable.yaml. Behavior-
# preserving: same decomposition_plan feeds the same TDD builder, same
# stack-appropriate (ts) verifier gates `reviewing`, byte-identical
# signoff-prefix and review-tail. `refactor_result` (write-only; never read by
# any guard/template in this flow) is dropped — flow.change does not surface the
# inner builder's raw `result` object as a top-level output — and replaced by
# the atom's own DoD-evidence slots (base_commit/impl_files_changed/ws_verify),
# the same convention flow.implement.deliverable uses.
workflows:
  flow.refactor.to-atomic-design:
    description: |
      Decompose a target component into atoms/molecules/organisms/templates:
      analyze structure (structureos) -> decomposition plan -> human signoff ->
      behavior-preserving refactor (via the flow.change atom, build_mode: tdd)
      -> ts verify -> React-antipattern review.
    # Spec A §5 — a ts/vite pack. The UI verify gate now lives INSIDE the
    # flow.change atom (stack auto-detected -> cognitive/cap.verify.ts); this
    # flow no longer declares its own `hop_slot: verify`.
    stack: ts
    inputs:
      target_path: { type: string, required: true }   # the component/dir to decompose
      ui_path:     { type: string, default: ui }
      base_ref:    { type: string, default: main }
      lexicon:     { type: object, default: {} }
    # NOTE: removing the sole `hop_slot: verify` transition does NOT relax
    # strict-blackboard mode — that mode is triggered by the PRESENCE of this
    # `blackboard:` block (declared_blackboard_slots), not by hop_slot (which
    # only auto-injected the `verify` slot's shape while it existed). Every
    # guard-read $.context slot must still be declared here (SPEC §11); the
    # old `verify` slot is gone (no guard reads it anymore) and is replaced by
    # `ws_verify` (read by `change_gate`, populated via flow.change's outputs).
    blackboard:
      target_path:        { type: string }
      ui_path:            { type: string }
      base_ref:           { type: string }
      lexicon:            { type: object }
      decomposition_plan: {}
      signoff_decision:   { type: string }
      base_commit:        { type: string }
      impl_files_changed: { type: integer }
      ws_verify:          {}
      review_verdict:     { type: string }
      review_findings:    {}
    # DoD-evidence seeds (same convention as flow.implement.deliverable): a
    # non-'pass' ws_verify default keeps change_gate fail-closed if the atom
    # ever returned without setting it.
    initialContext:
      base_commit: ""
      impl_files_changed: 0
      ws_verify: { status: "" }
    initialState: planning_decomposition
    states:
      planning_decomposition:
        # structureos is available via the gateway connection; the atomic skill
        # is the decomposition rubric. The agent reads target_path's structural
        # metrics (size, complexity, responsibilities) and emits a component tree.
        scope:
          skills:
            - implement.atomic.component-design
        transitions:
          draft:
            target: awaiting_signoff
            actor: deterministic
            executor:
              kind: workflow
              definitionId: cognitive/cap.plan.draft
              use:
                inputs:
                  brief:   "$.context.target_path"
                  lexicon: "$.context.lexicon"
                outputs:
                  "$.context.decomposition_plan": plan

      awaiting_signoff:
        transitions:
          signoff:
            target: signoff_received
            actor: deterministic
            executor:
              kind: workflow
              definitionId: cognitive/cap.gate.human-signoff
              use:
                inputs:
                  artifact: "$.context.decomposition_plan"
                  prompt:   "Approve the atomic-design decomposition plan?"
                outputs:
                  "$.context.signoff_decision": decision

      signoff_received:
        transitions:
          advance:
            target: changing
            actor: deterministic
            guards:
              - kind: expr
                expr: "$.context.signoff_decision == 'approved'"
          abort:
            target: failed
            actor: deterministic
            guards:
              - kind: expr
                expr: "$.context.signoff_decision == 'rejected'"
          # V23 poka-yoke: unguarded default routes any out-of-domain decision
          # deliberately to failed instead of a silent fall-through.
          default:
            target: failed
            actor: deterministic

      # Behavior-preserving: run the reusable change atom (build_mode: tdd) on
      # the decomposition plan. It routes the SAME builder this state used to
      # call directly (cap.implement.tdd-loop, against the existing tests +
      # stories — green stays green), then measures real file-change evidence
      # and runs the ts-stack verifier (auto-detected: deliverable.stack, else
      # this repo's filesystem — package.json), emitting the DoD-evidence
      # outputs `change_gate` reads. `target_path` (the component/dir to
      # decompose) is what this state used to pass tdd-loop as `scope_paths`;
      # flow.change's own building_tdd arm always threads the WHOLE
      # `deliverable` as scope_paths (the same convention its other TDD-mode
      # callers use) — that scoping choice now lives in the atom, not here.
      # backstop_cwd = $.run.repo_root (this flow operates on ONE repo; no
      # multi-repo re-root is needed) — the same value every existing
      # flow.change caller in the base pack passes.
      changing:
        goal: Run the reusable change atom (TDD build + ts verify + honest DoD) on the decomposition plan.
        transitions:
          change:
            target: change_gate
            actor: deterministic
            executor:
              kind: workflow
              definitionId: cognitive/flow.change
              use:
                inputs:
                  deliverable:  "$.context.decomposition_plan"
                  backstop_cwd: "$.run.repo_root"
                  build_mode:   "tdd"
                outputs:
                  "$.context.base_commit":        base_commit
                  "$.context.impl_files_changed": impl_files_changed
                  "$.context.ws_verify":          ws_verify

      # DoD HANDOFF GATE: replaces the old `ui_verified` gate's
      # `$.context.verify.status == 'pass'` read (the hop_slot-injected slot) with
      # `$.context.ws_verify.status == 'pass'` (flow.change's own DoD-evidence
      # output) + the atom's file-change evidence — the same defense-in-depth
      # shape flow.implement.deliverable's `change_gate` uses. Reaching this
      # state already implies the DoD was met (flow.change routes every
      # failure — no-op, verifier-fail, undetected stack — to its own `failed`
      # terminal, which errors the `changing` transition and fails this
      # mission directly); `abort` is fail-closed defense-in-depth.
      change_gate:
        transitions:
          advance:
            target: reviewing
            actor: deterministic
            guards:
              - { kind: expr, expr: "$.context.impl_files_changed >= 1" }
              - { kind: expr, expr: "$.context.ws_verify.status == 'pass'" }
          abort:
            target: failed
            actor: deterministic

      reviewing:
        transitions:
          review:
            target: reviewed
            actor: deterministic
            executor:
              kind: workflow
              definitionId: cognitive-max/cap.review.react-antipatterns
              use:
                inputs:
                  diff_against: "$.context.base_ref"
                  ui_path:      "$.context.ui_path"
                outputs:
                  "$.context.review_verdict":  verdict
                  "$.context.review_findings": findings

      reviewed:
        transitions:
          advance:
            target: done
            actor: deterministic
            guards:
              - kind: expr
                expr: "$.context.review_verdict == 'approved'"
          abort:
            target: failed
            actor: deterministic
            guards:
              - kind: expr
                expr: "$.context.review_verdict == 'rejected'"
          # V23 poka-yoke: routes an out-of-domain verdict (e.g. the review
          # enum's 'needs-revision') deliberately to failed, not a fall-through.
          default:
            target: failed
            actor: deterministic

      done:
        terminal: true

      failed:
        terminal: true
